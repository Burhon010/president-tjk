<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Управление — President.tjk</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/logo-256.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-topbar">
  <a class="brand" href="index.html">
    <img src="assets/logo-256.png" alt="President.tjk">
    <span class="brand-word"><b>President</b><span class="tld">.tjk</span></span>
  </a>
  <div class="topbar-actions">
    <a class="back" href="index.html">← Смотреть сайт</a>
    <a class="back" href="/admin.html?logout=1">Выйти</a>
  </div>
</div>

<!-- ============================================================ АДМИНКА -->
<div class="admin-main" id="adminApp">

  <div class="admin-head">
    <div>
      <h2>Товары</h2>
      <p class="count" id="productCount"></p>
    </div>
    <div class="admin-actions">
      <button class="btn btn-gold" id="addBtn" type="button">+ Добавить товар</button>
    </div>
  </div>

  <div class="filter-tabs" id="filterTabs">
    <button class="filter-tab is-active" type="button" data-cat="">Все</button>
    <button class="filter-tab" type="button" data-cat="Часы">Часы</button>
    <button class="filter-tab" type="button" data-cat="Сумки">Сумки</button>
    <button class="filter-tab" type="button" data-cat="Сувениры">Сувениры</button>
  </div>

  <div class="table-wrap">
    <table class="product-table">
      <thead>
        <tr>
          <th>Товар</th>
          <th>Категория</th>
          <th>Цена</th>
          <th>Описание</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="productTbody"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none;">Каталог пуст. Добавьте первый товар.</div>
  </div>
</div>

<!-- ============================================================ ФОРМА -->
<div class="form-overlay" id="formOverlay">
  <div class="form-panel">
    <h3 id="formTitle">Новый товар</h3>
    <form id="productForm">

      <div class="field">
        <label>Фото товара</label>
        <input type="file" id="photoInput" accept="image/*" hidden>
        <div class="photo-drop" id="photoDrop">
          <span id="photoPlaceholder">Нажмите, чтобы загрузить фото<br>(необязательно — без фото покажется фирменный значок)</span>
          <img id="photoPreview" style="display:none;" alt="Предпросмотр">
        </div>
      </div>

      <div class="field">
        <label for="catInput">Категория</label>
        <select id="catInput">
          <option>Часы</option>
          <option>Сумки</option>
          <option>Сувениры</option>
        </select>
      </div>

      <div class="field">
        <label for="nameInput">Название</label>
        <input type="text" id="nameInput" placeholder="Например, President Somoni Chronograph" required>
      </div>

      <div class="field">
        <label for="priceInput">Цена (TJS)</label>
        <input type="number" id="priceInput" placeholder="42500" min="1" step="1" required>
      </div>

      <div class="field">
        <label for="descInput">Описание товара</label>
        <textarea id="descInput" rows="3" placeholder="Коротко расскажите о материалах и особенностях товара"></textarea>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="cancelFormBtn">Отмена</button>
        <button type="submit" class="btn btn-gold">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/products-data.js"></script>
<script src="js/cloudinary.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
